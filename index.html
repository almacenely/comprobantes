<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lector de Comprobantes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; align-items: center; padding: 16px; }
    h2 { font-size: 1.1rem; color: #aaa; margin-bottom: 8px; }
    .camera-container { width: 100%; max-width: 420px; flex: 1; position: relative; border-radius: 16px; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
    video, img { width: 100%; height: 100%; object-fit: cover; }
    #canvasSnapshot { display: none; }
    .badge-total { position: absolute; bottom: 16px; background: rgba(0, 0, 0, 0.85); border: 1px solid #25D366; color: #25D366; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; display: none; }
    .controls { width: 100%; max-width: 420px; margin-top: 16px; display: flex; gap: 12px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-capturar { background-color: #007AFF; color: #fff; }
    .btn-otra { background-color: #333; color: #fff; display: none; }
    .btn-enviar { background-color: #25D366; color: #fff; display: none; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Lector de Mostrador</h2>

  <div class="camera-container">
    <video id="videoElement" autoplay playsinline></video>
    <img id="fotoPreview" style="display: none;" alt="Captura">
    <canvas id="canvasSnapshot"></canvas>
    <div id="badgeTotal" class="badge-total">✓ Total: $0</div>
  </div>

  <div class="controls">
    <button id="btnCapturar" class="btn-capturar" onclick="capturarFoto()">📷 Capturar</button>
    <button id="btnOtra" class="btn-otra" onclick="reiniciarCamara()">🔄 Otra</button>
    <button id="btnEnviar" class="btn-enviar" onclick="procesarYCompartir()">✓ Sumar y Compartir</button>
  </div>

  <script>
    // Configura tu URL de Google Apps Script
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyFeK9-FkJJRemOSNtilhz8WxXXCZdVDUNgDVIZ5xclRb7OjoY3SkSHgJZX4qyE-UAtCw/exec";

    const video = document.getElementById('videoElement');
    const fotoPreview = document.getElementById('fotoPreview');
    const canvas = document.getElementById('canvasSnapshot');
    const btnCapturar = document.getElementById('btnCapturar');
    const btnOtra = document.getElementById('btnOtra');
    const btnEnviar = document.getElementById('btnEnviar');
    const badgeTotal = document.getElementById('badgeTotal');

    let stream = null;
    let base64Capturada = "";
    let blobImagen = null;

    async function iniciarCamara() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Error al acceder a la cámara: " + err.message);
      }
    }

    function capturarFoto() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      base64Capturada = canvas.toDataURL('image/jpeg', 0.85);

      // Convertir en Blob directamente en RAM (sin escribir en disco)
      canvas.toBlob((blob) => {
        blobImagen = blob;
      }, 'image/jpeg', 0.85);

      fotoPreview.src = base64Capturada;
      fotoPreview.style.display = "block";
      video.style.display = "none";

      btnCapturar.style.display = "none";
      btnOtra.style.display = "block";
      btnEnviar.style.display = "block";
    }

    function reiniciarCamara() {
      fotoPreview.style.display = "none";
      video.style.display = "block";
      badgeTotal.style.display = "none";

      btnCapturar.style.display = "block";
      btnOtra.style.display = "none";
      btnEnviar.style.display = "none";
      btnEnviar.disabled = false;
      btnEnviar.textContent = "✓ Sumar y Compartir";
    }

    async function procesarYCompartir() {
      btnEnviar.disabled = true;
      btnEnviar.textContent = "⏳ Leyendo...";

      try {
        // Enviar al Apps Script para calcular la suma
        const respuesta = await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ image: base64Capturada })
        });

        const data = await respuesta.json();

        if (data.status === "success" && data.total > 0) {
          badgeTotal.textContent = "✓ Total: $" + Number(data.total).toLocaleString("es-CL");
          badgeTotal.style.display = "block";

          // Formato del pie de foto para el chat
          const textoMensaje = `*DETALLE DE VENTA*\n` +
                               `${data.desglose}\n\n` +
                               `*TOTAL: $${Number(data.total).toLocaleString("es-CL")}*`;

          // Crear archivo virtual en RAM
          const archivoFoto = new File([blobImagen], "comprobante.jpg", { type: "image/jpeg" });

          // Verificar si el navegador soporta compartir archivos nativos
          if (navigator.canShare && navigator.canShare({ files: [archivoFoto] })) {
            await navigator.share({
              files: [archivoFoto],
              text: textoMensaje,
              title: "Comprobante de Venta"
            });
            btnEnviar.disabled = false;
            btnEnviar.textContent = "✓ Sumar y Compartir";
          } else {
            // Alternativa si el navegador no soporta Web Share Level 2
            alert("Tu navegador no soporta adjuntar la foto directamente. Se abrirá WhatsApp con el texto.");
            const urlWa = `https://wa.me/?text=${encodeURIComponent(textoMensaje)}`;
            window.location.href = urlWa;
          }

        } else {
          alert("No se detectaron números claros. Intenta enfocar mejor.");
          btnEnviar.disabled = false;
          btnEnviar.textContent = "✓ Reintentar";
        }
      } catch (err) {
        // Si el usuario canceló la hoja de compartir no mostramos error
        if (err.name !== "AbortError") {
          alert("Error: " + err.message);
        }
        btnEnviar.disabled = false;
        btnEnviar.textContent = "✓ Sumar y Compartir";
      }
    }

    window.onload = iniciarCamara;
  </script>
</body>
</html>
