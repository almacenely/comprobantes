<script>
    const SCRIPT_URL = https://script.google.com/macros/s/AKfycbw0imf3_wRBZgztnru9QmEaC2j3WOUDCNIa_knauF9awm0ccIGDHy1ARafTxnTCKv80HA/exec";

    let base64Comprimido = "";
    let streamActual = null;

    window.addEventListener('DOMContentLoaded', encenderCamara);

    // Cuando regresas de WhatsApp a la pestaña, resetear automáticamente a la cámara
    window.addEventListener('pageshow', function() {
      resetearTodo();
    });

    async function encenderCamara() {
      const video = document.getElementById('videoStream');
      mostrarEstado("Iniciando cámara...", "st-loading");

      try {
        if (!streamActual) {
          streamActual = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
            audio: false
          });
        }
        video.srcObject = streamActual;
        mostrarEstado("", "");
      } catch (err) {
        mostrarEstado("Acceso a cámara requerido", "st-error");
      }
    }

    function capturar() {
      const video = document.getElementById('videoStream');
      const canvas = document.getElementById('canvasSnapshot');
      const preview = document.getElementById('fotoPreview');

      const maxDim = 1200;
      let w = video.videoWidth || 1280;
      let h = video.videoHeight || 720;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      base64Comprimido = canvas.toDataURL('image/jpeg', 0.85);

      video.style.display = "none";
      preview.src = base64Comprimido;
      preview.style.display = "block";

      // Asegurar que el botón verde esté reactivado y listo
      const btn = document.getElementById('btnEnviar');
      btn.disabled = false;

      document.getElementById('btnDisparar').style.display = "none";
      document.getElementById('grupoAcciones').style.display = "flex";
    }

    function repetir() {
      resetearTodo();
    }

    function resetearTodo() {
      base64Comprimido = "";

      // Reactivar el botón verde SIEMPRE
      const btn = document.getElementById('btnEnviar');
      if (btn) btn.disabled = false;

      // Ocultar foto congelada y mostrar visor en vivo
      const preview = document.getElementById('fotoPreview');
      const video = document.getElementById('videoStream');
      if (preview) preview.style.display = "none";
      if (video) video.style.display = "block";

      // Cambiar botones a modo disparo
      const grupo = document.getElementById('grupoAcciones');
      const disparar = document.getElementById('btnDisparar');
      if (grupo) grupo.style.display = "none";
      if (disparar) disparar.style.display = "block";

      mostrarEstado("", "");
    }

    async function enviar() {
      const btn = document.getElementById('btnEnviar');
      const nota = document.getElementById('notaInput').value.trim();

      // Desactivar temporalmente mientras la IA procesa
      btn.disabled = true;
      mostrarEstado("⏳ Sumando valores manuscritos...", "st-loading");

      const payload = {
        nota: nota,
        fotoBase64: base64Comprimido
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data && data.status === "ok") {
          mostrarEstado("✓ Total: $" + Number(data.total).toLocaleString('es-CL'), "st-ok");
          
          // Limpiar el campo de nota para la siguiente venta
          document.getElementById('notaInput').value = "";

          setTimeout(() => {
            window.location.href = data.urlWhatsApp;
            // Reactivar por si el usuario vuelve enseguida
            btn.disabled = false;
          }, 350);
        } else {
          throw new Error(data ? data.message : "Error");
        }
      } catch (err) {
        mostrarEstado("✓ Abriendo WhatsApp...", "st-ok");
        const fallbackMsg = "Hola, adjunto el comprobante de venta.";
        const waUrl = "whatsapp://send?text=" + encodeURIComponent(fallbackMsg);
        
        setTimeout(() => {
          window.location.href = waUrl;
          btn.disabled = false;
        }, 400);
      }
    }

    function mostrarEstado(msg, cls) {
      const b = document.getElementById('statusBox');
      b.className = cls;
      b.innerText = msg;
    }
  </script>
