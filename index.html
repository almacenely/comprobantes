<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cámara de Venta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Altura dinámica exacta para móviles (100dvh) */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      position: fixed;
    }

    .app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Barra superior translúcida flotante */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      z-index: 20;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    }

    .input-nota {
      width: 100%;
      background: rgba(22, 27, 34, 0.85);
      border: 1.5px solid #388bfd;
      border-radius: 10px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(8px);
    }
    .input-nota::placeholder {
      color: #8b949e;
    }

    /* Visor a pantalla completa */
    .camera-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video#videoStream {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    img#fotoPreview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #000000;
    }

    canvas#canvasSnapshot {
      display: none;
    }

    /* Barra inferior con margen para la barra de navegación de Android */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 16px));
      z-index: 20;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Botón disparador visible y centrado */
    .btn-disparo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid #388bfd;
      box-shadow: 0 0 20px rgba(56, 139, 253, 0.6);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }
    .btn-disparo:active {
      transform: scale(0.90);
    }

    /* Opciones post-disparo */
    .action-group {
      width: 100%;
      display: none;
      gap: 12px;
    }

    .btn-repetir {
      background: #21262d;
      color: #f0f6fc;
      border: 1.5px solid #8b949e;
      border-radius: 12px;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-enviar {
      flex: 1;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(35, 134, 54, 0.5);
    }
    .btn-enviar:disabled {
      background: #1b4725;
      color: #8b949e;
      cursor: not-allowed;
    }

    /* Notificación de estado flotante */
    #statusBox {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: none;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.6);
    }
    .st-loading { color: #58a6ff; display: block !important; }
    .st-ok { color: #3fb950; display: block !important; }
    .st-error { color: #f85149; display: block !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 1. Campo de nota superior -->
    <div class="top-bar">
      <input type="text" id="notaInput" class="input-nota" placeholder="Nota o cliente opcional (ej: Venta 1)">
    </div>

    <!-- 2. Visor central de cámara -->
    <div class="camera-frame">
      <video id="videoStream" autoplay playsinline muted></video>
      <img id="fotoPreview" alt="Captura">
      <canvas id="canvasSnapshot"></canvas>
    </div>

    <!-- 3. Controles inferiores con margen de seguridad -->
    <div class="bottom-bar">
      <div id="statusBox"></div>

      <!-- Disparador -->
      <button type="button" class="btn-disparo" id="btnDisparar" onclick="capturar()"></button>

      <!-- Opciones post-disparo -->
      <div class="action-group" id="grupoAcciones">
        <button type="button" class="btn-repetir" onclick="repetir()">🔄 Otra</button>
        <button type="button" class="btn-enviar" id="btnEnviar" onclick="enviar()">✓ Sumar y Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ COLOCA AQUÍ TU URL /exec DE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCj_v-jB0oZj6scGHg1pZrTl7Z1qm1DRBU6XmmpqQyPkANNqZYt_tFBz4ygJGJk7TgFg/exec";

    let base64Comprimido = "";
    let streamActual = null;

    window.addEventListener('DOMContentLoaded', encenderCamara);

    async function encenderCamara() {
      const video = document.getElementById('videoStream');
      mostrarEstado("Iniciando cámara...", "st-loading");

      try {
        streamActual = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = streamActual;
        mostrarEstado("", "");
      } catch (err) {
        mostrarEstado("Acceso a cámara requerido", "st-error");
        alert("Activa los permisos de la cámara en el navegador para continuar.");
      }
    }

    function capturar() {
      const video = document.getElementById('videoStream');
      const canvas = document.getElementById('canvasSnapshot');
      const preview = document.getElementById('fotoPreview');

      const maxDim = 1200;
      let w = video.videoWidth || 1280;
      let h = video.videoHeight || 720;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      base64Comprimido = canvas.toDataURL('image/jpeg', 0.8);

      video.style.display = "none";
      preview.src = base64Comprimido;
      preview.style.display = "block";

      document.getElementById('btnDisparar').style.display = "none";
      document.getElementById('grupoAcciones').style.display = "flex";
    }

    function repetir() {
      base64Comprimido = "";
      document.getElementById('fotoPreview').style.display = "none";
      document.getElementById('videoStream').style.display = "block";

      document.getElementById('grupoAcciones').style.display = "none";
      document.getElementById('btnDisparar').style.display = "block";
      mostrarEstado("", "");
    }

    async function enviar() {
      const btn = document.getElementById('btnEnviar');
      const nota = document.getElementById('notaInput').value.trim();

      btn.disabled = true;
      mostrarEstado("⏳ Leyendo números y guardando...", "st-loading");

      const payload = {
        nota: nota,
        fotoBase64: base64Comprimido
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data && data.status === "ok") {
          mostrarEstado("✓ ¡Total: $" + data.total + "! Abriendo WhatsApp...", "st-ok");
          setTimeout(() => {
            window.location.href = data.urlWhatsApp;
          }, 400);
        } else {
          throw new Error(data ? data.message : "Error");
        }
      } catch (err) {
        mostrarEstado("✓ Procesado. Abriendo WhatsApp...", "st-ok");
        const fallbackMsg = "Hola, adjunto el comprobante de venta.";
        const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(fallbackMsg);
        setTimeout(() => {
          window.location.href = waUrl;
        }, 600);
      }
    }

    function mostrarEstado(msg, cls) {
      const b = document.getElementById('statusBox');
      b.className = cls;
      b.innerText = msg;
    }
  </script>
</body>
</html>
