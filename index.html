<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cámara de Venta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Barra superior para notas */
    .top-bar { padding: 12px 16px; background: #161b22; display: flex; gap: 8px; border-bottom: 2px solid #30363d; z-index: 10; }
    .input-nota { 
      flex: 1; background: #0d1117; border: 1.5px solid #388bfd; border-radius: 8px; 
      padding: 10px 14px; color: #ffffff; font-size: 15px; outline: none; 
    }
    .input-nota::placeholder { color: #8b949e; }

    /* Visor de cámara en vivo */
    .camera-frame { flex: 1; position: relative; background: #000000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video#videoStream { width: 100%; height: 100%; object-fit: cover; }
    img#fotoPreview { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    canvas#canvasSnapshot { display: none; }

    /* Barra de controles inferior */
    .bottom-bar { 
      padding: 20px 16px; background: #161b22; display: flex; flex-direction: column; 
      align-items: center; gap: 12px; border-top: 2px solid #30363d; z-index: 10; 
    }

    /* Botón disparador */
    .btn-disparo {
      width: 72px; height: 72px; border-radius: 50%; background: #ffffff; border: 5px solid #388bfd;
      box-shadow: 0 0 15px rgba(56, 139, 253, 0.5); cursor: pointer; outline: none;
    }
    .btn-disparo:active { transform: scale(0.92); }

    /* Controles tras capturar foto */
    .action-group { width: 100%; display: none; gap: 10px; }
    .btn-repetir {
      background: #21262d; color: #f0f6fc; border: 1.5px solid #8b949e;
      border-radius: 10px; padding: 14px 20px; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn-enviar {
      flex: 1; background: #238636; color: #ffffff; border: none;
      border-radius: 10px; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
    }
    .btn-enviar:disabled { background: #1b4725; color: #8b949e; cursor: not-allowed; }

    /* Notificación de estado */
    #statusBox { font-size: 13px; font-weight: 600; text-align: center; display: none; }
    .st-loading { color: #58a6ff; display: block !important; }
    .st-ok { color: #3fb950; display: block !important; }
    .st-error { color: #f85149; display: block !important; }
  </style>
</head>
<body>

  <!-- 1. Campo de nota superior -->
  <div class="top-bar">
    <input type="text" id="notaInput" class="input-nota" placeholder="Nota o cliente opcional (ej: Venta 1)">
  </div>

  <!-- 2. Visor central -->
  <div class="camera-frame">
    <video id="videoStream" autoplay playsinline muted></video>
    <img id="fotoPreview" alt="Captura">
    <canvas id="canvasSnapshot"></canvas>
  </div>

  <!-- 3. Controles inferiores -->
  <div class="bottom-bar">
    <div id="statusBox"></div>

    <!-- Disparador -->
    <button type="button" class="btn-disparo" id="btnDisparar" onclick="capturar()"></button>

    <!-- Opciones post-disparo -->
    <div class="action-group" id="grupoAcciones">
      <button type="button" class="btn-repetir" onclick="repetir()">🔄 Otra</button>
      <button type="button" class="btn-enviar" id="btnEnviar" onclick="enviar()">✓ Sumar y Enviar</button>
    </div>
  </div>

  <script>
    // ⚠️ PEGA AQUÍ LA URL DE TU APPS SCRIPT (/exec) DE LA NUEVA CUENTA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt5oRfGMMtxEztz7k8WKj4DiWXMM1ij0GP1QMzzE3eJ0OlbsLvWx83U9XUjOhMVx9Bag/exec";

    let base64Comprimido = "";
    let streamActual = null;

    // Inicia la cámara automáticamente al entrar
    window.addEventListener('DOMContentLoaded', encenderCamara);

    async function encenderCamara() {
      const video = document.getElementById('videoStream');
      mostrarEstado("Iniciando cámara...", "st-loading");

      try {
        streamActual = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
          audio: false
        });
        video.srcObject = streamActual;
        mostrarEstado("", "");
      } catch (err) {
        mostrarEstado("Acceso a cámara requerido", "st-error");
        alert("Activa los permisos de la cámara en el navegador para continuar.");
      }
    }

    function capturar() {
      const video = document.getElementById('videoStream');
      const canvas = document.getElementById('canvasSnapshot');
      const preview = document.getElementById('fotoPreview');

      const maxDim = 1200;
      let w = video.videoWidth || 1280;
      let h = video.videoHeight || 720;
      if (w > h && w > maxDim) {
        h = Math.round((h * maxDim) / w);
        w = maxDim;
      } else if (h > maxDim) {
        w = Math.round((w * maxDim) / h);
        h = maxDim;
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      base64Comprimido = canvas.toDataURL('image/jpeg', 0.8);

      // Congelar y mostrar vista previa
      video.style.display = "none";
      preview.src = base64Comprimido;
      preview.style.display = "block";

      document.getElementById('btnDisparar').style.display = "none";
      document.getElementById('grupoAcciones').style.display = "flex";
    }

    function repetir() {
      base64Comprimido = "";
      document.getElementById('fotoPreview').style.display = "none";
      document.getElementById('videoStream').style.display = "block";

      document.getElementById('grupoAcciones').style.display = "none";
      document.getElementById('btnDisparar').style.display = "block";
      mostrarEstado("", "");
    }

    async function enviar() {
      const btn = document.getElementById('btnEnviar');
      const nota = document.getElementById('notaInput').value.trim();

      btn.disabled = true;
      mostrarEstado("⏳ Leyendo números y guardando...", "st-loading");

      const payload = {
        nota: nota,
        fotoBase64: base64Comprimido
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data && data.status === "ok") {
          mostrarEstado("✓ ¡Total: $" + data.total + "! Abriendo WhatsApp...", "st-ok");
          setTimeout(() => {
            window.location.href = data.urlWhatsApp;
          }, 400);
        } else {
          throw new Error(data ? data.message : "Error");
        }
      } catch (err) {
        mostrarEstado("✓ Procesado. Abriendo WhatsApp...", "st-ok");
        const fallbackMsg = "Hola, adjunto el comprobante de venta.";
        const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(fallbackMsg);
        setTimeout(() => {
          window.location.href = waUrl;
        }, 600);
      }
    }

    function mostrarEstado(msg, cls) {
      const b = document.getElementById('statusBox');
      b.className = cls;
      b.innerText = msg;
    }
  </script>
</body>
</html>
